<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheet Data</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Google Sheet Data</h1>
  <div id="sheet-data">Loading...</div>

  <script>
    class SheetRenderer {
      constructor() {
        this.SHEET_ID = '1T5xPD6bMuzIQZPEMX0N9AXktDGh-7uguoNcXZ_ih5XA'; // Replace with your Google Sheet ID
        this.SHEET_NAME = 'Form Responses 1'; // Replace with your sheet name
        this.tableContainer = document.getElementById('sheet-data'); // Container to hold the table
      }

      async init() {
        await this.fetchSheetData();
      }

      async fetchSheetData() {
        try {
          const response = await fetch(
            `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(this.SHEET_NAME)}`
          );

          const text = await response.text();
          const json = JSON.parse(text.substr(47).slice(0, -2)); // Extract JSON from the response

          if (json.table && json.table.rows) {
            this.renderTable(json.table); // Render the sheet data as a table
          } else {
            console.error('No data found in the sheet.');
            this.tableContainer.textContent = 'No data available.';
          }
        } catch (error) {
          console.error('Error fetching sheet data:', error);
          this.tableContainer.textContent = 'Failed to load data.';
        }
      }

      renderTable(tableData) {
        // Create a table element
        const table = document.createElement('table');
        table.style.width = '100%';
        table.setAttribute('border', '1');

        // Add table headers (first row of the sheet)
        const headerRow = document.createElement('tr');
        tableData.cols.forEach((col) => {
          const th = document.createElement('th');
          th.textContent = col.label;
          headerRow.appendChild(th);
        });
        table.appendChild(headerRow);

        // Add table rows (data rows of the sheet)
        tableData.rows.forEach((row) => {
          const tr = document.createElement('tr');
          row.c.forEach((cell) => {
            const td = document.createElement('td');
            td.textContent = cell?.v || ''; // Handle empty cells
            tr.appendChild(td);a
          });
          table.appendChild(tr);
        });

        // Append the table to the container
        this.tableContainer.innerHTML = ''; // Clear any existing content
        this.tableContainer.appendChild(table);
      }
    }

    // Initialize the sheet renderer
    const sheetRenderer = new SheetRenderer();
    sheetRenderer.init();
  </script>
</body>
</html>
