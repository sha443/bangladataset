<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submission Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #thankyouMessage {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
    </style>
</head>
<body>
    <iframe id="googleForm" src="https://docs.google.com/forms/d/e/1FAIpQLSelte-OMcZyANpkAIBIiVv9NS6Co0P8pDV-CHcv2NWZenASjQ/viewform?embedded=true" width="640" height="381" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>

    <div id="thankyouMessage">
        <h1>Thank you for submitting the form!</h1>
    </div>

    <script>
        const iframe = document.getElementById('googleForm');
        const thankyouMessage = document.getElementById('thankyouMessage');

        function checkFormSubmission() {
            try {
                const currentUrl = iframe.contentWindow.location.href;
                if (currentUrl.includes('formResponse')) {
                    thankyouMessage.style.display = 'block';
                    iframe.style.display = 'none';
                }
            } catch (e) {
                // Cross-origin access error, ignore
            }
        }

        // Check periodically for form submission
        setInterval(checkFormSubmission, 1000);
    </script>
</body>
</html>
